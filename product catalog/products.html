<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Products - SCF Steel Trading</title>

  <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./navbar.css">
  <link rel="stylesheet" href="./footer.css">

  <link
    rel="stylesheet"
    href="./products.css?v=20261003-3"
  >

  <script
    src="./products.js?v=20261003-3"
    defer
  ></script>
</head>

<body class="scf-catalog" data-page="catalog">

  <!-- NAVBAR -->
  <div id="navbar"></div>

  <!-- HERO -->
  <header class="catalog-hero">
    <div class="catalog-container">

      <h1>Our Products</h1>

      <p>
        Steel, roofing and hardware for your next project.
      </p>

    </div>
  </header>

  <!-- PRODUCT CATALOG -->
  <main class="catalog-container catalog-main">

    <!-- CATEGORY FILTERS AND SEARCH -->
    <div class="catalog-toolbar">

      <div
        class="catalog-filters"
        role="group"
        aria-label="Product categories"
      >
        <button
          type="button"
          data-filter="all"
          aria-pressed="true"
        >
          All
        </button>

        <button
          type="button"
          data-filter="steel"
          aria-pressed="false"
        >
          Steel Products
        </button>

        <button
          type="button"
          data-filter="roofing"
          aria-pressed="false"
        >
          Roofing Materials
        </button>

        <button
          type="button"
          data-filter="hardware"
          aria-pressed="false"
        >
          Hardware Items
        </button>

        <button
          type="button"
          data-filter="stainless"
          aria-pressed="false"
        >
          Stainless Products
        </button>
      </div>

      <!-- SINGLE SEARCH FORM -->
      <form
        id="catalogSearch"
        class="catalog-search"
        role="search"
      >
        <input
          id="productSearch"
          type="search"
          placeholder="Search products..."
          aria-label="Search products"
        >

        <button
          type="submit"
          aria-label="Search"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle
              cx="10.5"
              cy="10.5"
              r="6.5"
            ></circle>

            <path d="m16 16 4.5 4.5"></path>
          </svg>
        </button>
      </form>

    </div>

    <!-- HEADING AND RESULT COUNT -->
    <div class="catalog-heading">

      <p
        id="productCount"
        aria-live="polite"
        aria-atomic="true"
      ></p>

    </div>

    <!-- LOADING / EMPTY / ERROR MESSAGE -->
    <p
      id="catalogStatus"
      class="catalog-status"
      role="status"
    >
      Loading products...
    </p>

    <!-- PRODUCTS LOADED FROM DATABASE -->
    <div
      id="productGrid"
      class="catalog-grid"
    ></div>

    <!-- PAGINATION -->
    <nav
      id="catalogPagination"
      class="catalog-pagination"
      aria-label="Product pages"
    ></nav>

    <noscript>
      Please enable JavaScript to browse the product catalog.
    </noscript>

  </main>

  <!-- FOOTER -->
  <div id="footer"></div>

  <script src="./navbar.js"></script>
  <script src="./footer.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Product Details - SCF Steel Trading</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&family=Orbitron:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <!-- Shared website styles -->
  <link rel="stylesheet" href="./navbar.css">
  <link rel="stylesheet" href="./footer.css">

  <!-- Same updated stylesheet used by products.html -->
  <link
    rel="stylesheet"
    href="./products.css?v=20261003-2"
  >

  <!-- Handles both catalog and product details -->
  <script
    src="./products.js?v=20261003-2"
    defer
  ></script>
</head>

<body class="scf-catalog" data-page="details">

  <div id="navbar"></div>

  <main class="catalog-container catalog-main">

    <!-- Back link and breadcrumb -->
    <div class="catalog-heading catalog-navigation">

      <a id="backToProducts" href="./products.html">
        ← Back to products
      </a>

      <nav
        id="productBreadcrumb"
        aria-label="Breadcrumb"
      ></nav>

    </div>

    <!-- Loading, unavailable, or error message -->
    <p
      id="catalogStatus"
      class="catalog-status"
      role="status"
    >
      Loading product...
    </p>

    <!-- Populated by products.js -->
    <article
      id="productDetails"
      class="catalog-detail"
      hidden
    ></article>

    <!-- Related products -->
    <section
      id="relatedSection"
      class="catalog-related"
      aria-labelledby="relatedTitle"
      hidden
    >

      <div class="catalog-heading">

        <div>
          <h2 id="relatedTitle">Related Products</h2>
          <p id="relatedSubtitle"></p>
        </div>

        <a id="relatedAll" href="./products.html">
          View category →
        </a>

      </div>

      <div
        id="relatedGrid"
        class="catalog-grid"
      ></div>

    </section>

    <noscript>
      Please enable JavaScript to view product details.
    </noscript>

  </main>

  <div id="footer"></div>

  <script src="./navbar.js"></script>
  <script src="./footer.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Suppliers - SCF Steel Trading</title>

  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="topbar.css">
  <link rel="stylesheet" href="new-transaction.css">
  <link rel="stylesheet" href="new-purchase-order.css">
  <link rel="stylesheet" href="suppliers.css">
</head>

<body>

  <!-- SIDEBAR -->
  <div id="sidebar"></div>

  <!-- MAIN -->
  <main class="suppliers-main">

    <!-- TOPBAR (component) -->
    <div id="topbar" data-page-title="Suppliers"></div>

    <!-- CONTENT -->
    <div class="suppliers-content">

      <!-- PAGE HEADER -->
      <section class="suppliers-header">
        <div>
          <h1>Suppliers</h1>
          <p><span id="supplierRegisteredCount">0</span> Suppliers Registered</p>
        </div>

        <button type="button" class="add-supplier-btn" id="addSupplierBtn">
          <span class="plus">+</span>
          Supplier
        </button>
      </section>

      <!-- PANEL -->
      <section class="suppliers-panel">

        <!-- TOOLBAR -->
        <div class="suppliers-toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20l-4-4"></path>
            </svg>

            <input
              type="search"
              id="supplierSearch"
              placeholder="Search supplier name, contact, email..."
              autocomplete="off"
            >
          </div>

          <div class="supplier-filters">
            <select id="statusFilter">
              <option value="">All Status</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>

        <!-- TABLE AREA -->
        <div class="table-wrapper">

          <table class="suppliers-table">
            <thead>
              <tr>
                <th>SUPPLIER ID</th>
                <th>SUPPLIER NAME</th>
                <th>CONTACT PERSON</th>
                <th>CONTACT NUMBER</th>
                <th>EMAIL</th>
                <th>ADDRESS</th>
                <th>STATUS</th>
                <th class="actions-heading">ACTIONS</th>
              </tr>
            </thead>

            <!-- No rows yet -->
            <tbody id="supplierTableBody"></tbody>
          </table>

          <!-- EMPTY STATE (Sales-style) -->
          <div class="suppliers-empty" id="supplierEmptyState">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24">
                <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"></path>
                <path d="M9 8h6"></path>
                <path d="M9 12h6"></path>
              </svg>
            </div>

            <h3>No suppliers yet</h3>
            <p>Supplier records will appear here.</p>
          </div>

        </div>

        <!-- FOOTER (Sales-style) -->
        <div class="suppliers-table-footer">
          <p>
            Showing
            <strong id="visibleSupplierCount">0</strong>
            of
            <strong id="totalSupplierCount">0</strong>
            suppliers
          </p>

          <div class="pagination">
            <button type="button" id="previousPage" disabled>‹</button>
            <span id="currentPage">1</span>
            <button type="button" id="nextPage" disabled>›</button>
          </div>
        </div>

      </section>

    </div>
  </main>

   <!-- =========================
         MODALS
    ========================== -->

    <!-- NEW TRANSACTION MODAL -->
    <div id="newTransactionModal"></div>

    <!-- NEW PURCHASE ORDER MODAL -->
    <div id="newPurchaseOrderModal"></div>

  <script src="sidebar.js"></script>
  <script src="topbar.js"></script>
  <script src="new-transaction.js"></script>
  <script src="new-purchase-order.js"></script>
  <script src="suppliers.js"></script>
</body>
</html>

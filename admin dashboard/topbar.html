<!-- =========================
     ADMIN TOP BAR
========================= -->

<header class="admin-topbar">

    <!-- PAGE TITLE -->
    <h1 id="topbarPageTitle"></h1>


    <!-- RIGHT SIDE -->
    <div class="topbar-right">


        <!-- =========================
             QUICK ACCESS
        ========================== -->
        <div class="quick-access">

            <button
                type="button"
                class="quick-access-btn"
                id="quickAccessBtn"
            >
                <span class="quick-plus">+</span>

                <span class="quick-access-label">
                    Quick Access
                </span>

                <span class="quick-arrow">
                    ▼
                </span>
            </button>


            <!-- QUICK ACCESS DROPDOWN -->
            <div
                class="quick-access-menu"
                id="quickAccessMenu"
            >

                <p class="quick-menu-title">
                    QUICK ACCESS
                </p>


                <!-- =========================
                     NEW TRANSACTION
                ========================== -->
                <!-- NEW TRANSACTION -->
<button
    type="button"
    class="quick-access-item"
    id="quickNewTransaction"
>
    <div class="quick-access-symbol">
        +
    </div>

    <div class="quick-access-text">
        <strong>New Transaction</strong>
        <span>Sales with optional fabrication</span>
    </div>
</button>


                <!-- =========================
                     NEW PURCHASE ORDER
                ========================== -->
                <button
                    type="button"
                    class="quick-access-item"
                    id="quickNewPurchaseOrder"
                >

                    <div class="quick-access-symbol">
                        +
                    </div>

                    <div class="quick-access-text">

                        <strong>
                            New Purchase Order
                        </strong>

                        <span>
                            Create a supplier purchase order
                        </span>

                    </div>

                </button>
                
                <!-- =========================
                     STOCK IN
                ========================== -->
                <button
                    type="button"
                    class="quick-access-item"
                    id="quickStockIn"
                >

                    <div class="quick-access-symbol">
                        ↓
                    </div>

                    <div class="quick-access-text">

                        <strong>
                            Stock In
                        </strong>

                        <span>
                            Receive inventory
                        </span>

                    </div>

                </button>


                <!-- =========================
                     STOCK OUT
                ========================== -->
                <button
                    type="button"
                    class="quick-access-item"
                    id="quickStockOut"
                >

                    <div class="quick-access-symbol">
                        ↑
                    </div>

                    <div class="quick-access-text">

                        <strong>
                            Stock Out
                        </strong>

                        <span>
                            Record inventory release
                        </span>

                    </div>

                </button>


                <!-- =========================
                     ADD PRODUCT
                ========================== -->
                <button
                    type="button"
                    class="quick-access-item"
                    id="quickAddProduct"
                >

                    <div class="quick-access-symbol">
                        +
                    </div>

                    <div class="quick-access-text">

                        <strong>
                            Add Product
                        </strong>

                        <span>
                            Create a new product
                        </span>

                    </div>

                </button>

            </div>

        </div>


        <!-- TOPBAR DIVIDER -->
        <div class="topbar-divider"></div>


        <!-- =========================
             NOTIFICATIONS
        ========================== -->
        <div class="notifications">

            <button
                type="button"
                class="notification-btn"
                id="notificationBtn"
                aria-label="Notifications"
            >

                <span class="notification-bell"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>

                <span
                    class="notification-badge"
                    id="notificationBadge"
                ></span>

            </button>


            <!-- NOTIFICATION DROPDOWN -->
            <div
                class="notification-menu"
                id="notificationMenu"
            >

                <!-- HEADER -->
                <div class="notification-header">

                    <div>

                        <h2>
                            Notifications
                            <span class="notification-count" id="notificationCount"></span>
                        </h2>

                        <p>
                            System alerts and updates
                        </p>

                    </div>


                    <button
                        type="button"
                        id="markAllReadBtn"
                    >
                        Mark all as read
                    </button>

                </div>


                <!-- TABS -->
                <div class="notification-tabs" id="notificationTabs">
                    <button type="button" class="notification-tab active" data-tab="all">All</button>
                    <button type="button" class="notification-tab" data-tab="inquiries">Inquiries</button>
                    <button type="button" class="notification-tab" data-tab="alerts">Alerts</button>
                </div>


                <!-- NOTIFICATION LIST -->
                <div
                    class="notification-list"
                    id="notificationList"
                >

                    <!-- EMPTY STATE -->
                    <div
                        class="notification-empty"
                        id="notificationEmpty"
                    >

                        <div class="notification-empty-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></div>

                        <strong>
                            No notifications
                        </strong>

                        <p>
                            You're all caught up.
                        </p>

                    </div>

                </div>

            </div>

        </div>


        <!-- TOPBAR DIVIDER -->
        <div class="topbar-divider"></div>


        <!-- =========================
             DATE AND TIME
        ========================== -->
        <div class="topbar-datetime">

            <span id="currentDate">
                Loading date...
            </span>

            <div class="datetime-divider"></div>

            <span id="currentTime">
                Loading time...
            </span>

        </div>

    </div>

</header>

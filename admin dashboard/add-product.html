<dialog
    class="ap-modal"
    id="addProductModal"
    aria-labelledby="apTitle"
>
    <form id="apForm">

        <!-- =========================
             HEADER
        ========================= -->
        <header class="ap-header">

            <div>
                <h2 id="apTitle">Add Product</h2>

                <p>
                    Register a new product.
                </p>
            </div>

            <button
                type="button"
                class="ap-close"
                data-ap-close
                aria-label="Close Add Product"
            >
                ×
            </button>

        </header>


        <!-- =========================
             CONTENT
        ========================= -->
        <div class="ap-body">

            <section class="ap-section">

                <div class="ap-section-title">

                    <span class="ap-number">
                        1
                    </span>

                    <h3>
                        Product Information
                    </h3>

                </div>


                <div class="ap-details">

                    <!-- PRODUCT FIELDS -->
                    <div class="ap-fields">

                        <!-- PRODUCT ID -->
                        <label>
                            Product ID

                            <input
                                type="text"
                                id="apProductId"
                                value="Auto-generated"
                                readonly
                            >
                        </label>


                        <!-- PRODUCT NAME -->
                        <label>
                            Product Name *

                            <input
                                type="text"
                                name="name"
                                maxlength="100"
                                placeholder="e.g. Square Tube"
                                required
                            >
                        </label>


                        <!-- CATEGORY -->
                        <label class="ap-wide">
                            Category *

                            <select
                                name="category_id"
                                id="apCategory"
                                required
                            >
                                <option value="">
                                    Select a category
                                </option>
                            </select>
                        </label>


                        <!-- DESCRIPTION -->
                        <label class="ap-wide">
                            Description

                            <textarea
                                name="description"
                                rows="5"
                                maxlength="1000"
                                placeholder="Describe the product and its uses."
                            ></textarea>
                        </label>

                    </div>


                    <!-- =========================
                         PRODUCT IMAGE
                    ========================= -->
                    <div class="ap-image-box">

                        <img
                            id="apImagePreview"
                            alt="Product image preview"
                            hidden
                        >


                        <div
                            id="apImagePlaceholder"
                            class="ap-image-placeholder"
                        >
                            No image selected
                        </div>


                        <label>
                            Product Image

                            <input
                                id="apImage"
                                name="image"
                                type="file"
                                accept="image/png,image/jpeg,image/webp"
                            >
                        </label>


                        <small>
                            PNG, JPG or WebP · up to 2 MB
                        </small>


                        <button
                            type="button"
                            id="apRemoveImage"
                            class="ap-text-btn"
                            hidden
                        >
                            Remove image
                        </button>

                    </div>

                </div>


                <!-- =========================
                     PRODUCT CATALOG
                ========================= -->
                <label class="ap-catalog">

                    <input
                        type="checkbox"
                        name="showInCatalog"
                        checked
                    >

                    <span>

                        <strong>
                            Show in Product Catalog
                        </strong>

                        <small>
                            Display this product in the public product catalog.
                            Stock quantities will not be shown.
                        </small>

                    </span>

                </label>

            </section>


            <!-- ERROR -->
            <p
                id="apError"
                class="ap-error"
                role="alert"
                hidden
            ></p>

        </div>


        <!-- =========================
             FOOTER
        ========================= -->
        <footer class="ap-footer">

            <span>
                Variants can be managed separately after creating the product.
            </span>

            <div>

                <button
                    type="button"
                    class="ap-secondary"
                    data-ap-close
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="ap-primary"
                    id="apSave"
                >
                    Save Product
                </button>

            </div>

        </footer>

    </form>

</dialog>
